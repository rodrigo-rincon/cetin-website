AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Isolated content API for cetin-website

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0848873ae9c755fd8
  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-0f6996a3d488917af,subnet-0bbfc9f0c259bda9b
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-01a79910b3804c080
  DatabaseHost:
    Type: String
    Default: cetin-test-db.c5goqkww44oa.us-east-1.rds.amazonaws.com
  DatabaseSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-1:011528289560:secret:rds!db-3a8d6a9c-991a-4935-a5fb-1932f71d83b4-y8JStf
  DatabaseName:
    Type: String
    Default: cetin_test
  JwtSecret:
    Type: String
    NoEcho: true
  WebOrigin:
    Type: String

Resources:
  WebsiteMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref WebOrigin]
            AllowedMethods: [GET, PUT]
            AllowedHeaders: ['*']
            MaxAge: 600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  WebsiteMediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteMediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${WebsiteMediaBucket.Arn}/*'

  ContentLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound access for the isolated CETIN website content Lambda
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  DatabaseIngressFromContentLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ContentLambdaSecurityGroup
      Description: PostgreSQL from cetin-website-content-api only

  ContentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cetin-website-content-api-test
      Description: Public content and superadmin-only editing for cetin-website test
      CodeUri: ../backend
      Handler: src/index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      VpcConfig:
        SecurityGroupIds:
          - !Ref ContentLambdaSecurityGroup
        SubnetIds: !Ref LambdaSubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DatabaseHost
          DB_PORT: '5432'
          DB_SECRET_ARN: !Ref DatabaseSecretArn
          DB_NAME: !Ref DatabaseName
          JWT_SECRET: !Ref JwtSecret
          WEB_ORIGIN: !Ref WebOrigin
          MEDIA_BUCKET: !Ref WebsiteMediaBucket
          MEDIA_PUBLIC_URL: !Sub 'https://${WebsiteMediaBucket.RegionalDomainName}'
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DatabaseSecretArn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:DeleteObject
              Resource:
                - !Sub '${WebsiteMediaBucket.Arn}/branches/*'
                - !Sub '${WebsiteMediaBucket.Arn}/upcoming/*'
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref WebOrigin
          AllowHeaders:
            - authorization
            - content-type
          AllowMethods:
            - GET
            - PUT
            - POST
            - DELETE
          MaxAge: 600

Outputs:
  ContentApiUrl:
    Description: URL for VITE_CONTENT_API_URL (append /api)
    Value: !GetAtt ContentFunctionUrl.FunctionUrl
  MediaBucketName:
    Description: Test bucket for editable CETIN website media
    Value: !Ref WebsiteMediaBucket
